<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="340" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/>

  <text x="20" y="26" font-size="16" font-weight="bold" fill="#1a1a2e">B&amp;R (Break &amp; Retest) — bullish example</text>
  <text x="20" y="44" font-size="11.5" fill="#666666">Mirrored for a bearish B&amp;R at a support-style level</text>

  <!-- level line -->
  <line x1="20" y1="220" x2="620" y2="220" stroke="#7d3c98" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="24" y="214" font-size="12" fill="#7d3c98">Level (e.g. PDH / swing high)</text>

  <!-- candle 1: bullish, approaching from below -->
  <line x1="90" y1="250" x2="90" y2="292" stroke="#1abc57" stroke-width="1.6"/>
  <rect x="80" y="258" width="20" height="28" fill="#1abc57"/>

  <!-- candle 2: the BREAK bar - closes beyond the level -->
  <line x1="180" y1="188" x2="180" y2="234" stroke="#1abc57" stroke-width="1.8"/>
  <rect x="170" y="194" width="20" height="32" fill="#1abc57"/>

  <!-- candle 3: the RETEST bar - wick returns to level, close holds above -->
  <line x1="270" y1="176" x2="270" y2="222" stroke="#e08e0b" stroke-width="1.8"/>
  <rect x="260" y="182" width="20" height="25" fill="#e08e0b"/>

  <!-- candle 4: bullish continuation -->
  <line x1="360" y1="140" x2="360" y2="188" stroke="#1abc57" stroke-width="1.6"/>
  <rect x="350" y="148" width="20" height="33" fill="#1abc57"/>

  <!-- candle 5: bullish continuation further -->
  <line x1="450" y1="88" x2="450" y2="150" stroke="#1abc57" stroke-width="1.6"/>
  <rect x="440" y="95" width="20" height="45" fill="#1abc57"/>

  <!-- continuation arrow -->
  <path d="M 470,95 L 540,55 L 528,55 M 540,55 L 540,67" fill="none" stroke="#1a1a2e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- break bar label -->
  <text x="115" y="182" font-size="11" fill="#0e7a37" font-weight="bold">Break</text>
  <text x="105" y="196" font-size="10" fill="#555555">close beyond level</text>

  <!-- retest bar label -->
  <text x="285" y="178" font-size="11" fill="#a86400" font-weight="bold">Retest</text>
  <text x="215" y="242" font-size="10" fill="#555555">wick touches level,</text>
  <text x="215" y="255" font-size="10" fill="#555555">close holds above it</text>

  <text x="105" y="288" font-size="11.5" fill="#1a1a2e" font-weight="bold">Break bar closes past level → pending until a retest holds it (no fixed window)</text>
  <text x="200" y="305" font-size="12" fill="#1a1a2e" font-weight="bold">→ Bullish B&amp;R confirmed on the retest bar, direction confirmed here</text>
</svg>
