<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="340" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/>

  <text x="20" y="26" font-size="16" font-weight="bold" fill="#1a1a2e">SFP (Swing Failure Pattern) — bullish example</text>
  <text x="20" y="44" font-size="11.5" fill="#666666">Mirrored for a bearish SFP at a resistance-style level</text>

  <!-- level line -->
  <line x1="20" y1="220" x2="620" y2="220" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="24" y="214" font-size="12" fill="#c0392b">Level (e.g. PDL / swing low)</text>

  <!-- candle 1: bearish, approaching from above -->
  <line x1="90" y1="130" x2="90" y2="180" stroke="#c0392b" stroke-width="1.6"/>
  <rect x="80" y="145" width="20" height="25" fill="#c0392b"/>

  <!-- candle 2: bearish, closer to level -->
  <line x1="180" y1="160" x2="180" y2="216" stroke="#c0392b" stroke-width="1.6"/>
  <rect x="170" y="172" width="20" height="34" fill="#c0392b"/>

  <!-- candle 3: the SFP bar - wicks below level, closes back above -->
  <line x1="270" y1="182" x2="270" y2="246" stroke="#1abc57" stroke-width="1.8"/>
  <rect x="260" y="188" width="20" height="20" fill="#1abc57"/>

  <!-- candle 4: bullish continuation -->
  <line x1="360" y1="142" x2="360" y2="192" stroke="#1abc57" stroke-width="1.6"/>
  <rect x="350" y="150" width="20" height="35" fill="#1abc57"/>

  <!-- candle 5: bullish continuation further -->
  <line x1="450" y1="92" x2="450" y2="155" stroke="#1abc57" stroke-width="1.6"/>
  <rect x="440" y="100" width="20" height="45" fill="#1abc57"/>

  <!-- continuation arrow -->
  <path d="M 470,100 L 540,58 L 528,58 M 540,58 L 540,70" fill="none" stroke="#1a1a2e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- annotation for the SFP bar -->
  <line x1="270" y1="246" x2="270" y2="270" stroke="#1a1a2e" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="200" y="288" font-size="11.5" fill="#1a1a2e" font-weight="bold">Wick sweeps ≥ MinSweepDepthATRmult × ATR</text>
  <text x="200" y="303" font-size="11.5" fill="#1a1a2e" font-weight="bold">below the level, closes back above it</text>
  <text x="240" y="318" font-size="12" fill="#1a1a2e" font-weight="bold">→ single-bar Bullish SFP, direction confirmed here</text>
</svg>
