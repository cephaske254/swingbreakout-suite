<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="Helvetica, Arial, sans-serif">
  <!-- background -->
  <rect x="0" y="0" width="820" height="560" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/>

  <!-- title -->
  <text x="20" y="28" font-size="17" font-weight="bold" fill="#1a1a2e">Entry &amp; Target Sequence After a Level Visit (Buy Setup)</text>
  <text x="20" y="46" font-size="12" fill="#666666">Mirror for a sell setup</text>

  <!-- SL lines (red, dashed, full width) -->
  <line x1="20" y1="433.8" x2="600" y2="433.8" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="608" y="437.5" font-size="11.5" fill="#c0392b">SL (Normal) = A</text>

  <line x1="20" y1="381.3" x2="600" y2="381.3" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="2,3"/>
  <text x="608" y="385" font-size="11.5" fill="#c0392b">SL (Conservative) = C</text>

  <!-- 100% extension line A-B-C (orange, dashed) -->
  <line x1="280" y1="276.3" x2="600" y2="276.3" stroke="#e08e0b" stroke-width="1.6" stroke-dasharray="7,4"/>
  <text x="608" y="280" font-size="11.5" fill="#e08e0b">100% Ext. (A→B→C)</text>

  <!-- fib retracement D-C (purple) -->
  <line x1="280" y1="256.6" x2="600" y2="256.6" stroke="#7d3c98" stroke-width="1.3" stroke-dasharray="3,3"/>
  <text x="608" y="260" font-size="11" fill="#7d3c98">0% (D)</text>

  <line x1="280" y1="318.9" x2="600" y2="318.9" stroke="#7d3c98" stroke-width="1.8"/>
  <text x="608" y="322.5" font-size="11.5" fill="#7d3c98" font-weight="bold">50% Entry</text>

  <line x1="280" y1="381.3" x2="600" y2="381.3" stroke="#7d3c98" stroke-width="1.3" stroke-dasharray="3,3"/>
  <text x="608" y="377" font-size="11" fill="#7d3c98">100% (C)</text>

  <!-- 261.8% target line (teal, dashed) -->
  <line x1="280" y1="54.8" x2="600" y2="54.8" stroke="#008080" stroke-width="1.8" stroke-dasharray="8,3"/>
  <text x="608" y="58.5" font-size="11.5" fill="#008080" font-weight="bold">261.8% Target</text>
  <text x="608" y="72" font-size="10" fill="#008080">= C + (D−C)×2.618</text>

  <!-- price path -->
  <polyline points="60,433.8 190,328.8 280,381.3 360,276.3 400,256.6 480,318.9 560,150 630,60"
            fill="none" stroke="#1a1a2e" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- continuation arrowhead toward target -->
  <path d="M 618,74 L 630,60 L 616,52" fill="none" stroke="#1a1a2e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- key point markers -->
  <circle cx="60" cy="433.8" r="5" fill="#2471a3"/>
  <circle cx="190" cy="328.8" r="5" fill="#2471a3"/>
  <circle cx="280" cy="381.3" r="5" fill="#2471a3"/>
  <circle cx="400" cy="256.6" r="5.5" fill="#e08e0b"/>
  <circle cx="480" cy="318.9" r="6" fill="#1abc57" stroke="#0e7a37" stroke-width="1.5"/>

  <!-- point labels -->
  <text x="45" y="458" font-size="14" font-weight="bold" fill="#2471a3">A</text>
  <text x="35" y="473" font-size="10.5" fill="#555555">Swing Low</text>

  <text x="175" y="314" font-size="14" font-weight="bold" fill="#2471a3">B</text>
  <text x="150" y="300" font-size="10.5" fill="#555555">Top of first leg</text>

  <text x="290" y="401" font-size="14" font-weight="bold" fill="#2471a3">C</text>
  <text x="290" y="416" font-size="10.5" fill="#555555">Bottom of 1st retracement</text>

  <text x="408" y="244" font-size="14" font-weight="bold" fill="#e08e0b">D</text>
  <text x="408" y="229" font-size="10.5" fill="#555555">New high (past 100% ext.)</text>

  <text x="490" y="314" font-size="12.5" font-weight="bold" fill="#0e7a37">Entry</text>
  <text x="490" y="336" font-size="10.5" fill="#555555">50% retracement of D→C</text>
  <text x="490" y="349" font-size="10.5" fill="#555555">(2nd retracement)</text>

  <!-- legend -->
  <rect x="20" y="470" width="780" height="76" fill="#f7f7f9" stroke="#dcdcdc" stroke-width="1"/>
  <text x="30" y="486" font-size="11" fill="#1a1a2e">A→B→C = extension anchors (swing low, 1st leg high, 1st retracement low). D = high after price clears 100% ext.</text>
  <text x="30" y="502" font-size="11" fill="#1a1a2e">Entry = 50% of a standard retracement drawn on D→C, during the 2nd retracement. SL: conservative = C, normal = A.</text>
  <text x="30" y="518" font-size="11" fill="#1a1a2e">Target = 261.8% extension of the same C→D leg, projected beyond D: Target = C + (D − C) × 2.618.</text>
  <text x="30" y="536" font-size="10.5" fill="#888888">Direction (buy vs. sell) is set first by whether the visited level produced an SFP or a B&amp;R.</text>
</svg>
